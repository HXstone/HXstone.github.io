<!DOCTYPE html>
<!--
  ============================================================
  博客文章模板 · 用法
  ------------------------------------------------------------
  1. 复制本文件,命名为 日期-英文短标题.html,例如:
       2026-10-01-my-first-post.html
  2. 修改 <title>、meta description、h1、日期、语言标签和正文
  3. 到 ../blog.html 的文章列表里复制一张卡片,改成新文章的链接和标题
     (如果它是最新的一篇,也可以同步更新 ../index.html 的"最新文章")
  4. 语言标记:
     - 中文文章:<html lang="zh-CN"> + <span class="badge badge-lang">中文</span>
     - 英文文章:<html lang="en">    + <span class="badge badge-lang">EN</span>
  5. 正文写在 <article class="prose"> 里,支持 h2 / h3 / p / ul / ol /
     blockquote / pre code / img / hr,样式全局统一
  6. 本文件不会被任何页面链接到,留着当模板即可
  ============================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章标题 · H 的小站</title>
<meta name="description" content="一句话摘要。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/i18n.js" defer></script>
<script src="../assets/main.js" defer></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../index.html">
      <span class="brand-mark" aria-hidden="true">H</span>
      <span class="brand-name" data-i18n="site.name">H 的小站</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="菜单 / Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" aria-label="主导航 / Main">
      <a href="../index.html" data-i18n="nav.home">首页</a>
      <a href="../projects.html" data-i18n="nav.projects">作品</a>
      <a href="../blog.html" aria-current="page" data-i18n="nav.blog">博客</a>
      <a href="../about.html" data-i18n="nav.about">关于</a>
      <button class="lang-toggle" type="button">EN</button>
    </nav>
  </div>
</header>

<main class="wrap article-wrap">

  <a class="back-link" href="../blog.html" data-i18n="blog.back">← 返回博客</a>

  <article class="prose">
    <header class="article-head">
      <h1>文章标题</h1>
      <p class="post-meta"><time datetime="2026-01-01">2026-01-01</time><span class="badge badge-lang">中文</span></p>
    </header>

    <p>在这里写第一段。开头可以是一句话总结,或者一个吸引人的问题。</p>

    <h2>小标题</h2>
    <p>正文段落。需要强调时可以用 <strong>加粗</strong>,行内代码写成 <code>这样</code>。</p>
    <ul>
      <li>列表项一</li>
      <li>列表项二</li>
    </ul>

    <blockquote>
      <p>想引用一句话时用这个样式。</p>
    </blockquote>
  </article>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span data-year>2026</span> <span data-i18n="site.name">H 的小站</span></p>
    <p><a href="../about.html" data-i18n="footer.contact">联系我</a></p>
  </div>
</footer>

</body>
</html>
